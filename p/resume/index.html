<!DOCTYPE html>
<html lang="en">
<head>
    <!-- meta -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume</title>
    <link rel="icon" type="image/x-icon" href="./media/favicon.svg">


    <!-- links -->
    <link rel="stylesheet" type="text/css" href="./resume.css">
    <script src="resume.js" defer></script>

    <!-- fonts, icons -->
    <script src="https://kit.fontawesome.com/f773a491f7.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
</head>
<body>
    <!-- interactive buttons -->
    <header>
        <!-- download buttons -->
        <div class="downloads btn-group btn-group-toggle" data-toggle="buttons">
            <button class="word">Download .DOCX <i class="fa-solid fa-download"></i></button>
            <p>or</p>
            <button class="pdf">Download .PDF <i class="fa-solid fa-download"></i></button>
        </div>

        <br>

        <!-- style buttons -->
        <div class="stylings btn-group btn-group-toggle" data-toggle="buttons">
            <button onclick="swapStyle('graphical')">Graphical
                <i id="graphical" class="fa-solid fa-circle-check" style="color: #63E6BE;"></i>
            </button>
            <p>or</p>
            <button onclick="swapStyle('textual')">Text Based
                <i id="textual" style="color: #63E6BE;"></i>
            </button>
        </div>
    </header>



    <!-- resume -->
    <main>
        <!-- graphical -->
        <div class="graphical">
            <ul>
                <ul class="list-ic vertical">
                    <li>
                        <span>&#160;</span>
                        Bread
                    </li>
                    <li>
                        <span>&#160;</span>
                        Cheese
                    </li>
                    <li>
                        <span>&#160;</span>
                        milk
                    </li>
                </ul>
            </ul>
        </div>




        <!-- text based -->
        <div class="pure-text">
            abc
        </div>
    </main>
</body>
</html>
